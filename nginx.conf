# === Nginx: pakai ini jika server Anda Nginx (bukan Apache) ===
# Taruh di dalam blok server { ... }

types { text/markdown md; }

location = / {
    add_header Link '</llms.txt>; rel="describedby"; type="text/plain", </index.md>; rel="alternate"; type="text/markdown"' always;
    add_header Vary Accept always;

    if ($http_accept ~* "text/markdown") {
        rewrite ^ /index.md last;
    }
    # lanjutkan ke handler homepage Anda yang sekarang (try_files / fastcgi_pass / dll)
}

location = /index.md {
    default_type "text/markdown; charset=utf-8";
}

location = /llms.txt {
    default_type "text/plain; charset=utf-8";
}
